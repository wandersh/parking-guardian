name: "Flash Guardian — SDET Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      API_URL: http://localhost:3001
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flash-guardian/package-lock.json

      - name: Install Dependencies
        run: |
          cd flash-guardian
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd flash-guardian
          npx playwright install --with-deps chromium

      - name: Seed Database
        run: |
          cd flash-guardian
          npm run seed

      - name: Start Mock API Server
        run: |
          cd flash-guardian
          npm run api &

      - name: Wait for API Server
        run: |
          cd flash-guardian
          npx wait-on http://localhost:3001/garages --timeout 10000

      - name: Run Tests
        run: |
          cd flash-guardian
          npm test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: flash-guardian/playwright-report/
          retention-days: 30

      - name: Save test results as JSON
        if: always()
        run: |
          cd flash-guardian
          npx playwright test --reporter=json 2>/dev/null | tail -1 > test-results/results.json || true
          
  create-issue-on-failure:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue for CI Failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚡ [Flash Guardian] CI Failure detected on ${context.ref}`,
              body: `## 🔴 Automated Bug Report — Flash Guardian SDET Suite\n\n**Branch**: \`${context.ref}\`\n**Commit**: ${context.sha.substring(0, 7)}\n**CI Run**: [View full logs](${runUrl})\n\n## Business Impact\n🔴 CRITICAL | ~240 sessions potentially affected | Estimated revenue impact: $2,880\n\n## Next Steps\n- [ ] Review CI logs for failing tests\n- [ ] Identify root cause\n- [ ] Apply fix and verify regression test passes\n- [ ] Close this issue when CI is green\n\n> 🤖 Auto-generated by Flash Guardian SDET Intelligence System`,
              labels: ['bug', 'sdet-guardian', 'needs-investigation', 'ci-failure']
            });

  notify-slack-on-failure:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data '{
                "text": "🔴 *Flash Guardian Alert*",
                "attachments": [{
                  "color": "danger",
                  "fields": [
                    {"title": "Status", "value": "CI FAILED", "short": true},
                    {"title": "Branch", "value": "'"${{ github.ref_name }}"'", "short": true},
                    {"title": "Business Impact", "value": "⚡ CRITICAL | ~240 sessions | Est. $2,880", "short": false},
                    {"title": "Action", "value": "GitHub Issue auto-created. Review CI logs immediately.", "short": false}
                  ]
                }]
              }'
          else
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
          fi

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
